server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Client-side routing (react-router-dom) - any path not matching a
    # real static file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the backend service on the internal Docker
    # network. This makes API calls same-origin from the browser's
    # perspective (no CORS needed for normal app traffic) and means the
    # backend never needs to be reachable directly from the internet -
    # see docker-compose.yml, where it publishes no host port at all.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/notifications/stream is a long-lived Server-Sent-Events
        # connection - buffering here would queue events behind nginx's
        # buffer instead of delivering them live.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
