server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Client-side routing (react-router-dom) - any path not matching a
    # real static file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the backend service on the internal Docker
    # network. This makes API calls same-origin from the browser's
    # perspective (no CORS needed for normal app traffic) and means the
    # backend never needs to be reachable directly from the internet -
    # see docker-compose.yml, where it publishes no host port at all.
    #
    # The long timeout and disabled buffering below were previously applied
    # to *every* /api/ request, not just the SSE stream - a stuck or slow
    # backend call on any normal endpoint would leave nginx holding the
    # client connection open for up to an hour instead of failing it in a
    # reasonable time, which is consistent with pages "sometimes stop
    # loading completely" with no error. Split into its own location so
    # only the actual long-lived SSE connection gets that treatment.
    location /api/notifications/stream {
        proxy_pass http://backend:8000/api/notifications/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffering here would queue events behind nginx's buffer instead
        # of delivering them live; the long read timeout keeps the
        # connection open between events instead of nginx closing it.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A stuck/slow backend call now fails in a reasonable time instead
        # of hanging the page indefinitely; normal buffering re-enabled for
        # the throughput/connection-reuse benefit it gives ordinary
        # request/response traffic.
        proxy_read_timeout 60s;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
